name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER || 'dressnio' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode Base64 SSH Key or read raw private key
          if echo "$VPS_SSH_KEY" | grep -q -- "-----BEGIN"; then
            printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$VPS_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          # Add Host to known_hosts
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Execute Deployment Script on Server
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "bash -l -c '
              cd /var/www/${VPS_USER} && \
              chmod +x deploy/deploy.sh && \
              ./deploy/deploy.sh
            '"

      - name: Production Live Verification
        run: |
          echo "Waiting 5 seconds for services to initialize..."
          sleep 5
          curl -sS -o /dev/null -w "Homepage HTTP status: %{http_code}\n" "https://dressnio.softcredible.com/" || echo "Health check curl warning (DNS/SSL may still be propagating)"
