version: "3.9"

# Production deployment for dressnio (Nuxt 4 + Laravel 12 + MySQL 8.0)
# Attached to central Caddy gateway via external network `caddy_net`

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://dressnio.softcredible.com/api}
    container_name: ${APP_NAME:-dressnio}-frontend-1
    restart: unless-stopped
    networks:
      - internal
      - caddy_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${APP_NAME:-dressnio}-backend-1
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend-storage:/var/www/html/storage
    networks:
      - internal
      - caddy_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-dressnio}-db-1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dressnio}
      MYSQL_USER: ${DB_USERNAME:-dressnio}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  db-data:
  backend-storage:

networks:
  internal:
    driver: bridge
  caddy_net:
    external: true
