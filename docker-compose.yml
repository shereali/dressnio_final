version: "3.9"

# Auto-generated by Dev Project Launcher
# Backend + Frontend mono-repo setup

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dressnio-full-project-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - NODE_ENV=developmentchr(10)      - HOST=0.0.0.0chr(10)      - PORT=8000chr(10)      - NUXT_HOST=0.0.0.0chr(10)      - NUXT_PORT=8000chr(10)      - DB_HOST=dbchr(10)      - DB_PORT=3306chr(10)      - DB_DATABASE=dressnio_adminchr(10)      - DB_USERNAME=rootchr(10)      - DB_PASSWORD=
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dressnio-full-project-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - //app/node_modules
    environment:
      - NODE_ENV=developmentchr(10)      - HOST=0.0.0.0chr(10)      - PORT=3000chr(10)      - NUXT_HOST=0.0.0.0chr(10)      - NUXT_PORT=3000
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: dressnio-full-project-db
    environment:
      MYSQL_DATABASE: dressnio_admin
      MYSQL_USER: root
      MYSQL_PASSWORD: 
      MYSQL_ROOT_PASSWORD: 
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
